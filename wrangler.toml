# Cloudflare Pages configuration for local preview and future deployment.
# While this file exists, keep deployment variables here instead of duplicating
# them in the Cloudflare dashboard.

name = "withering-realms-wiki"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Canonical site URL. DNS and deployment are not configured yet.
SITE_URL = "https://withering-realms.gamefieldhq.com"

# Comments remain disabled until this site has its own GitHub repository.
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"

# Sponsor card and analytics remain disabled until real accounts are connected.
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
PUBLIC_CF_BEACON_TOKEN = ""

# Optional deployment variables:
# PUBLIC_ADSENSE_CLIENT = ""
# PUBLIC_ADSENSE_SLOT_STICKY = ""
# PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
# PUBLIC_ADSENSE_SLOT_INCONTENT = ""
# PUBLIC_GA_ID = ""
# PUBLIC_GSC_VERIFICATION = ""
